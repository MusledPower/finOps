services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: decomposer
      POSTGRES_USER: decomposer
      POSTGRES_PASSWORD: decomposer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decomposer -d decomposer"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
